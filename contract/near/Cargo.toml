[package]
name = "soulpr_near"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5", features = ["legacy"] }
borsh = { version = "1.0.0", features = ["derive"] }
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing", "legacy"] }

# Build target (run once): rustup target add wasm32-unknown-unknown
# Build:    cargo build --target wasm32-unknown-unknown --release
