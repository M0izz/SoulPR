name: NEAR contract

on:
  workflow_dispatch:
  push:
    paths:
      - "contract/near/**"
      - ".github/workflows/rust-near.yml"
  pull_request:
    paths:
      - "contract/near/**"
      - ".github/workflows/rust-near.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract/near
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Print Rust toolchain information
        run: |
          rustc --version
          cargo --version
          rustup show active-toolchain
          rustup target list --installed
      - name: Check Rust formatting
        working-directory: ${{ github.workspace }}
        run: cargo fmt --manifest-path contract/near/Cargo.toml -- --check
      - name: Run NEAR Rust tests
        run: cargo test --locked
      - name: Build release WASM
        run: cargo build --locked --target wasm32-unknown-unknown --release
      - name: Report WASM artifact and SHA-256
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(target/wasm32-unknown-unknown/release/*.wasm)
          if [[ ${#artifacts[@]} -ne 1 ]]; then
            echo "Expected exactly one generated WASM artifact; found ${#artifacts[@]}: ${artifacts[*]}" >&2
            exit 1
          fi
          artifact="${artifacts[0]}"
          echo "WASM artifact: ${artifact}"
          sha256sum "${artifact}"