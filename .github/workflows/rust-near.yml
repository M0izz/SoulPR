name: NEAR contract

on:
  push:
    paths:
      - "contract/near/**"
      - ".github/workflows/rust-near.yml"
  pull_request:
    paths:
      - "contract/near/**"
      - ".github/workflows/rust-near.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract/near
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo test
      - run: cargo build --target wasm32-unknown-unknown --release